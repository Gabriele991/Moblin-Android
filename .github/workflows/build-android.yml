name: Build Moblin Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'StreamPack/**'
      - 'bond-bunny/**'
      - '.github/workflows/build-android.yml'
      - 'gradle/**'
      - '*.gradle.kts'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Get public git submodules over HTTPS
        run: |
          git -c 'url.https://github.com/.insteadOf=git@github.com:' submodule update --init --recursive --depth 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moblin-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
